<nb-layout windowMode>
  <nb-layout-header fixed>
    <div class="encabezado">
      <div class="izquierda">
        <button class="boton-menu" nbButton ghost size="small" (click)="alternarMenu()" aria-label="Mostrar u ocultar el menú">
          <nb-icon icon="menu-2-outline"></nb-icon>
        </button>
        <a class="marca" routerLink="/inicio">
          <img src="assets/icons/icon-192.png" alt="" width="32" height="32">
          <span>{{ nombreSistema }}</span>
        </a>
      </div>
      <div class="derecha">
      <app-instalar-app tamano="tiny"></app-instalar-app>
      <nb-actions size="small" *ngIf="perfil$ | async as perfil">
        <nb-action class="usuario">
          <nb-user [name]="perfil.usuario.nombre" [title]="perfil.usuario.rol?.nombre" size="medium"></nb-user>
        </nb-action>
        <nb-action icon="lock-outline" title="Cambiar contraseña" (click)="cambiarClave()"></nb-action>
        <nb-action icon="log-out-outline" title="Cerrar sesión" (click)="salir()"></nb-action>
      </nb-actions>
      </div>
    </div>
  </nb-layout-header>

  <nb-sidebar class="menu-lateral" tag="menu" responsive>
    <nb-menu [items]="(menu$ | async) || []" autoCollapse></nb-menu>
  </nb-sidebar>

  <nb-layout-column>
    <router-outlet></router-outlet>
  </nb-layout-column>
</nb-layout>
